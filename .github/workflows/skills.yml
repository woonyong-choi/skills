name: Skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python3 -m pip install pytest==8.4.2
      - name: Check skills
        run: python3 tools/skill-sync/scripts/skill_check.py .
      - name: Install skills for hook integration tests
        run: |
          mkdir -p "$HOME/.codex" "$HOME/.claude"
          python3 tools/skill-sync/scripts/install.py --source . --tool codex --tool claude-code
      - name: Run Python tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m pytest -q tools/skill-sync/tests git/git-issue/tests docs/repo-docs/tests docs/repo-docs-llms/tests docs/html-report/tests/test_thinkflow_cli.py
      - name: Load figure renderer
        uses: actions/checkout@v4
        with:
          repository: woonyong-choi/thinkflow
          ref: a562019726020c6991355abec0d4543c06c78ec8
          path: .runtime/thinkflow
      - name: Install figure renderer and browser
        working-directory: .runtime/thinkflow
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Run report tests
        run: python3 docs/html-report/tests/test_build_report.py --thinkflow .runtime/thinkflow
      - name: Verify README figures
        run: |
          python3 experiments/skill-exposure/scripts/03-analyze.py
          python3 scripts/render_readme.py .runtime/thinkflow/src/cli.js
          git diff --exit-code -- docs/assets experiments/skill-exposure/results
